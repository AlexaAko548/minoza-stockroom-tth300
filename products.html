<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stockroom - Products</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Ensure the modal is hidden by default */
    #modalBackdrop { display: none; }
    #modalBackdrop.active { display: grid; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">+</span><span>stockroom</span></div>
      <div class="workspace-switcher"><span class="store-dot"></span> Elrem Store<span class="chevron">⌄</span></div>
      <nav class="nav-list" aria-label="Main navigation">
        <p class="nav-label">Workspace</p>
        <a href="index.html" class="nav-item"><span class="nav-icon">↗</span>Overview</a>
        <a href="inventory.html" class="nav-item"><span class="nav-icon">▦</span>Inventory</a>
        <a href="products.html" class="nav-item active"><span class="nav-icon">◈</span>Products</a>
        <a href="sales.html" class="nav-item"><span class="nav-icon">◒</span>Sales</a>
      </nav>
      <div class="sidebar-bottom">
        <div class="sync-status"><span class="pulse"></span> Local mode <small>Ready for API</small></div>
        <button class="profile"><span class="avatar">AR</span><span><strong>Alex Rivera</strong><small>Store manager</small></span><span class="dots">•••</span></button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumb">Elrem Store <span>/</span> Products</div>
        <div class="top-actions">
          <button class="icon-button" title="Notifications">♧<i></i></button>
          <button class="help-button">?</button>
          <button class="avatar small">AR</button>
        </div>
      </header>
      <div class="page-wrap">
        <div class="page-heading">
          <div>
            <p class="eyebrow">Thursday, September 10, 2026</p>
            <h1>Products</h1>
            <p class="subheading">Your complete catalog, in one tidy place.</p>
          </div>
          <button class="primary-button" onclick="openModal()"><span>+</span> Add product</button>
        </div>
        
        <section class="panel table-panel">
          <div class="table-toolbar">
            <div><p class="eyebrow">Catalog</p><h2>All products <span class="count-badge" id="productCount">0</span></h2></div>
            <div class="toolbar-actions">
              <label class="search"><span>⌕</span><input type="text" id="searchInput" placeholder="Search products"></label>
              <button class="filter-button">☷ Filter</button>
            </div>
          </div>
          <!-- Dynamic grid container for Read (R) operation -->
          <div class="product-grid" id="productGrid"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- Hidden Modal for Create (C) and Update (U) operations -->
  <div class="modal-backdrop" id="modalBackdrop" onmousedown="handleBackdropClick(event)">
    <form class="modal" id="productForm" onsubmit="saveRecord(event)">
      <div class="modal-heading">
        <div>
          <p class="eyebrow" id="modalEyebrow">New catalog item</p>
          <h2 id="modalTitle">Add product</h2>
        </div>
        <button type="button" class="close-button" onclick="closeModal()">×</button>
      </div>
      <div class="form-grid">
        <input type="hidden" id="productId" name="id" />
        <label class="full">Product name<input id="productName" name="name" required placeholder="e.g. Morning Mug" /></label>
        <label>Category
          <select id="productCategory" name="category">
            <option>Home</option><option>Accessories</option><option>Kitchen</option>
            <option>Stationery</option><option>Beauty</option>
          </select>
        </label>
        <label>Supplier<input id="productSupplier" name="supplier" required placeholder="Supplier name" /></label>
        <label>Units in stock<input id="productStock" name="stock" type="number" min="0" required /></label>
        <label>Reorder at<input id="productReorder" name="reorderAt" type="number" min="0" required /></label>
        <label>Unit price<input id="productPrice" name="price" type="number" min="0" step="0.01" required /></label>
      </div>
      <div class="modal-actions">
        <button type="button" class="secondary-button" onclick="closeModal()">Cancel</button>
        <button class="primary-button" type="submit" id="submitBtn">Add product</button>
      </div>
    </form>
  </div>

  <script>
    // 1. INITIALIZE LOCAL STORAGE (Seeding data if empty)
    let inventory = JSON.parse(localStorage.getItem('inventoryData'));
    if (!inventory) {
      inventory = [
        { id: 'ITM-' + Date.now(), name: 'Morning Mug', category: 'Home', stock: 45, reorderAt: 10, price: 12.00, supplier: 'Supplier Inc.', status: 'In stock' },
        { id: 'ITM-' + (Date.now()+1), name: 'Steel Pan', category: 'Kitchen', stock: 5, reorderAt: 10, price: 45.00, supplier: 'Culinary Co.', status: 'Low stock' }
      ];
      localStorage.setItem('inventoryData', JSON.stringify(inventory));
    }

    // Helper functions
    const calculateStatus = (stock, reorderAt) => {
      if (stock === 0) return 'Out of stock';
      if (stock <= reorderAt) return 'Low stock';
      return 'In stock';
    };

    const getIcon = (category) => {
      if (category === 'Home') return '⌂';
      if (category === 'Kitchen') return '◒';
      return '◌';
    };

    // 2. READ: Render products to the DOM
    function renderProducts(filterQuery = '') {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = ''; // Clear grid

      const filtered = inventory.filter(item => 
        item.name.toLowerCase().includes(filterQuery.toLowerCase()) || 
        item.category.toLowerCase().includes(filterQuery.toLowerCase())
      );

      document.getElementById('productCount').textContent = filtered.length;

      filtered.forEach(item => {
        const statusClass = item.status.toLowerCase().replaceAll(' ', '-');
        const thumbClass = item.category.toLowerCase();
        
        const article = document.createElement('article');
        article.className = 'product-card';
        article.innerHTML = `
          <div class="large-thumb ${thumbClass}">${getIcon(item.category)}</div>
          <div class="product-card-body">
            <span class="eyebrow">${item.category}</span>
            <h3>${item.name}</h3>
            <p>${item.id} · ${item.supplier}</p>
            <div class="card-footer">
              <strong>$${parseFloat(item.price).toFixed(2)}</strong>
              <span class="status ${statusClass}">${item.status}</span>
            </div>
            <div class="card-actions">
              <button onclick="openModal('${item.id}')">Edit details</button>
              <button onclick="deleteRecord('${item.id}')">Delete</button>
            </div>
          </div>
        `;
        grid.appendChild(article);
      });
    }

    // Search event listener
    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderProducts(e.target.value);
    });

    // 3. CREATE & UPDATE: Modal Logic
    const backdrop = document.getElementById('modalBackdrop');
    const form = document.getElementById('productForm');

    function openModal(id = null) {
      form.reset();
      backdrop.classList.add('active');

      if (id) {
        // Edit Mode (Populate form)
        const item = inventory.find(i => i.id === id);
        document.getElementById('modalEyebrow').textContent = 'Update catalog';
        document.getElementById('modalTitle').textContent = 'Edit product';
        document.getElementById('submitBtn').textContent = 'Save changes';
        
        document.getElementById('productId').value = item.id;
        document.getElementById('productName').value = item.name;
        document.getElementById('productCategory').value = item.category;
        document.getElementById('productSupplier').value = item.supplier;
        document.getElementById('productStock').value = item.stock;
        document.getElementById('productReorder').value = item.reorderAt;
        document.getElementById('productPrice').value = item.price;
      } else {
        // Create Mode
        document.getElementById('modalEyebrow').textContent = 'New catalog item';
        document.getElementById('modalTitle').textContent = 'Add product';
        document.getElementById('submitBtn').textContent = 'Add product';
        document.getElementById('productId').value = '';
      }
    }

    function closeModal() {
      backdrop.classList.remove('active');
    }

    function handleBackdropClick(e) {
      if (e.target === backdrop) closeModal();
    }

    function saveRecord(e) {
      e.preventDefault();
      
      const stockVal = Number(document.getElementById('productStock').value);
      const reorderVal = Number(document.getElementById('productReorder').value);
      
      const record = {
        name: document.getElementById('productName').value,
        category: document.getElementById('productCategory').value,
        supplier: document.getElementById('productSupplier').value,
        stock: stockVal,
        reorderAt: reorderVal,
        price: Number(document.getElementById('productPrice').value),
        status: calculateStatus(stockVal, reorderVal)
      };

      const existingId = document.getElementById('productId').value;

      if (existingId) {
        // Update
        const index = inventory.findIndex(i => i.id === existingId);
        inventory[index] = { ...inventory[index], ...record };
      } else {
        // Create
        record.id = 'ITM-' + Date.now(); // Generate simple ID
        inventory.push(record);
      }

      // Save to storage and re-render
      localStorage.setItem('inventoryData', JSON.stringify(inventory));
      closeModal();
      renderProducts(document.getElementById('searchInput').value);
    }

    // 4. DELETE
    function deleteRecord(id) {
      const item = inventory.find(i => i.id === id);
      if (window.confirm(`Delete ${item.name}?`)) {
        inventory = inventory.filter(i => i.id !== id);
        localStorage.setItem('inventoryData', JSON.stringify(inventory));
        renderProducts(document.getElementById('searchInput').value);
      }
    }

    // Initial render
    renderProducts();
  </script>
</body>
</html>
