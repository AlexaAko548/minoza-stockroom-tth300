<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stockroom - Products</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Ensure the modal is hidden by default */
    #modalBackdrop { display: none; }
    #modalBackdrop.active { display: grid; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">+</span><span>stockroom</span></div>
      <div class="workspace-switcher"><span class="store-dot"></span> Elrem Store<span class="chevron">⌄</span></div>
      <nav class="nav-list" aria-label="Main navigation">
        <p class="nav-label">Workspace</p>
        <a href="index.html" class="nav-item"><span class="nav-icon">↗</span>Overview</a>
        <a href="inventory.html" class="nav-item"><span class="nav-icon">▦</span>Inventory</a>
        <a href="products.html" class="nav-item active"><span class="nav-icon">◈</span>Products</a>
        <a href="sales.html" class="nav-item"><span class="nav-icon">◒</span>Sales</a>
      </nav>
      <div class="sidebar-bottom">
        <div class="sync-status"><span class="pulse"></span> Local mode <small>Ready for API</small></div>
        <button class="profile"><span class="avatar">AR</span><span><strong>Alex Rivera</strong><small>Store manager</small></span><span class="dots">•••</span></button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumb">Elrem Store <span>/</span> Products</div>
        <div class="top-actions">
          <button class="icon-button" title="Notifications">♧<i></i></button>
          <button class="help-button">?</button>
          <button class="avatar small">AR</button>
        </div>
      </header>
      <div class="page-wrap">
        <div class="page-heading">
          <div>
            <p class="eyebrow">Thursday, September 10, 2026</p>
            <h1>Products</h1>
            <p class="subheading">Your complete catalog, in one tidy place.</p>
          </div>
          <button class="primary-button" onclick="openModal()"><span>+</span> Add product</button>
        </div>
        
        <section class="panel table-panel">
          <div class="table-toolbar">
            <div><p class="eyebrow">Catalog</p><h2>All products <span class="count-badge" id="productCount">0</span></h2></div>
            <div class="toolbar-actions">
              <label class="search"><span>⌕</span><input type="text" id="searchInput" placeholder="Search products"></label>
              <button class="filter-button">☷ Filter</button>
            </div>
          </div>
          <!-- Dynamic grid container for Read (R) operation -->
          <div class="product-grid" id="productGrid"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- Hidden Modal for Create (C) and Update (U) operations -->
  <div class="modal-backdrop" id="modalBackdrop" onmousedown="handleBackdropClick(event)">
    <form class="modal" id="productForm" onsubmit="saveRecord(event)">
      <div class="modal-heading">
        <div>
          <p class="eyebrow" id="modalEyebrow">New catalog item</p>
          <h2 id="modalTitle">Add product</h2>
        </div>
        <button type="button" class="close-button" onclick="closeModal()">×</button>
      </div>
      <div class="form-grid">
        <input type="hidden" id="productId" name="id" />
        <label class="full">Product name<input id="productName" name="name" required placeholder="e.g. Morning Mug" /></label>
        <label>Category
          <select id="productCategory" name="category">
            <option>Home</option><option>Accessories</option><option>Kitchen</option>
            <option>Stationery</option><option>Beauty</option>
          </select>
        </label>
        <label>Supplier<input id="productSupplier" name="supplier" required placeholder="Supplier name" /></label>
        <label>Units in stock<input id="productStock" name="stock" type="number" min="0" required /></label>
        <label>Reorder at<input id="productReorder" name="reorderAt" type="number" min="0" required /></label>
        <label>Unit price<input id="productPrice" name="price" type="number" min="0" step="0.01" required /></label>
      </div>
      <div class="modal-actions">
        <button type="button" class="secondary-button" onclick="closeModal()">Cancel</button>
        <button class="primary-button" type="submit" id="submitBtn">Add product</button>
      </div>
    </form>
  </div>

  <script>
    let inventory = [];

    const backdrop = document.getElementById('modalBackdrop');
    const form = document.getElementById('productForm');

    const searchInput = document.getElementById('searchInput');
    const productGrid = document.getElementById('productGrid');
    const productCount = document.getElementById('productCount');


    // ---------------------------------
    // READ PRODUCTS FROM DATABASE
    // ---------------------------------

    async function loadProducts() {
        try {
            const response = await fetch('/api/products');

            if (!response.ok) {
                throw new Error('Failed to load products');
            }

            inventory = await response.json();

            renderProducts();

        } catch (error) {
            console.error(error);

            productGrid.innerHTML = `
                <div class="empty-state">
                    Failed to load products.
                </div>
            `;
        }
    }


    // ---------------------------------
    // RENDER PRODUCTS
    // ---------------------------------

    function renderProducts(filterQuery = '') {

        productGrid.innerHTML = '';

        const filtered = inventory.filter(item =>
            item.name.toLowerCase().includes(filterQuery.toLowerCase()) ||
            item.category.toLowerCase().includes(filterQuery.toLowerCase())
        );

        productCount.textContent = filtered.length;


        if (filtered.length === 0) {

            productGrid.innerHTML = `
                <div class="empty-state">
                    No products found.
                </div>
            `;

            return;
        }


        filtered.forEach(item => {

            const statusClass =
                item.status.toLowerCase().replaceAll(' ', '-');

            const thumbClass =
                item.category.toLowerCase();

            const article =
                document.createElement('article');

            article.className = 'product-card';


            article.innerHTML = `
                <div class="large-thumb ${thumbClass}">
                    ${getIcon(item.category)}
                </div>

                <div class="product-card-body">

                    <span class="eyebrow">
                        ${item.category}
                    </span>

                    <h3>${item.name}</h3>

                    <p>
                        ITM-${item.id} · ${item.supplier}
                    </p>

                    <div class="card-footer">

                        <strong>
                            ₱${parseFloat(item.price).toFixed(2)}
                        </strong>

                        <span class="status ${statusClass}">
                            ${item.status}
                        </span>

                    </div>

                    <div class="card-actions">

                        <button onclick="openModal(${item.id})">
                            Edit details
                        </button>

                        <button onclick="deleteRecord(${item.id})">
                            Delete
                        </button>

                    </div>

                </div>
            `;

            productGrid.appendChild(article);
        });
    }


    // ---------------------------------
    // CATEGORY ICON
    // ---------------------------------

    function getIcon(category) {

        if (category === 'Home') {
            return '⌂';
        }

        if (category === 'Kitchen') {
            return '◒';
        }

        return '◌';
    }


    // ---------------------------------
    // SEARCH
    // ---------------------------------

    searchInput.addEventListener('input', (event) => {

        renderProducts(event.target.value);

    });


    // ---------------------------------
    // OPEN MODAL
    // ---------------------------------

    function openModal(id = null) {

        form.reset();

        backdrop.classList.add('active');


        // EDIT
        if (id !== null) {

            const item =
                inventory.find(product => product.id === id);

            if (!item) {
                return;
            }


            document.getElementById('modalEyebrow')
                .textContent = 'Update catalog';

            document.getElementById('modalTitle')
                .textContent = 'Edit product';

            document.getElementById('submitBtn')
                .textContent = 'Save changes';


            document.getElementById('productId')
                .value = item.id;

            document.getElementById('productName')
                .value = item.name;

            document.getElementById('productCategory')
                .value = item.category;

            document.getElementById('productSupplier')
                .value = item.supplier;

            document.getElementById('productStock')
                .value = item.stock;

            document.getElementById('productReorder')
                .value = item.reorderAt;

            document.getElementById('productPrice')
                .value = item.price;

        }

        // CREATE
        else {

            document.getElementById('modalEyebrow')
                .textContent = 'New catalog item';

            document.getElementById('modalTitle')
                .textContent = 'Add product';

            document.getElementById('submitBtn')
                .textContent = 'Add product';

            document.getElementById('productId')
                .value = '';
        }
    }


    // ---------------------------------
    // CLOSE MODAL
    // ---------------------------------

    function closeModal() {

        backdrop.classList.remove('active');

    }


    function handleBackdropClick(event) {

        if (event.target === backdrop) {
            closeModal();
        }

    }


    // ---------------------------------
    // CREATE / UPDATE
    // ---------------------------------

    async function saveRecord(event) {

        event.preventDefault();


        const id =
            document.getElementById('productId').value;


        const product = {

            name:
                document.getElementById('productName').value,

            category:
                document.getElementById('productCategory').value,

            supplier:
                document.getElementById('productSupplier').value,

            stock:
                Number(
                    document.getElementById('productStock').value
                ),

            reorderAt:
                Number(
                    document.getElementById('productReorder').value
                ),

            price:
                Number(
                    document.getElementById('productPrice').value
                )
        };


        try {

            let response;


            // UPDATE
            if (id) {

                response = await fetch(
                    `/api/products/${id}`,
                    {
                        method: 'PUT',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify(product)
                    }
                );

            }

            // CREATE
            else {

                response = await fetch(
                    '/api/products',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify(product)
                    }
                );
            }


            if (!response.ok) {

                const error =
                    await response.json();

                throw new Error(error.error);

            }


            closeModal();

            await loadProducts();


        } catch (error) {

            console.error(error);

            alert(
                'Failed to save product: ' +
                error.message
            );
        }
    }


    // ---------------------------------
    // DELETE
    // ---------------------------------

    async function deleteRecord(id) {

        const item =
            inventory.find(product => product.id === id);


        if (!item) {
            return;
        }


        const confirmed =
            window.confirm(
                `Delete ${item.name}?`
            );


        if (!confirmed) {
            return;
        }


        try {

            const response = await fetch(
                `/api/products/${id}`,
                {
                    method: 'DELETE'
                }
            );


            if (!response.ok) {

                const error =
                    await response.json();

                throw new Error(error.error);

            }


            await loadProducts();


        } catch (error) {

            console.error(error);

            alert(
                'Failed to delete product: ' +
                error.message
            );
        }
    }


    // ---------------------------------
    // INITIAL LOAD
    // ---------------------------------

    loadProducts();

</script>
</body>
</html>
